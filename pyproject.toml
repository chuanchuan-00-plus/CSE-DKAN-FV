[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cse-dkan-fv"
version = "0.1.0"
description = "Conservative subcell reconstruction for one-dimensional shocks with a discontinuity-aware KAN"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
  "Pillow>=10",
  "pypdf>=4",
  "python-docx>=1.1",
  "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
